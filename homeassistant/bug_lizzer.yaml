# Bug-Lizzer Planning ⇄ Home Assistant
# Home Assistant checks the app's mailbox every 3 seconds (it only reaches out; nothing comes in),
# runs the matching script here on the home network, and reports back.
# Needs `bug_lizzer_token` in secrets.yaml.

wake_on_lan:   # lets Home Assistant switch the LG TV on

rest_command:
  bug_lizzer_poll:
    url: https://ndbanzpiwhaqvtsepszf.supabase.co/rest/v1/rpc/ha_poll
    method: POST
    headers:
      apikey: sb_publishable_ShdakQ72QP9DFFyTPcg0_g_IBZBdNcc
      x-ha-token: !secret bug_lizzer_token
    content_type: application/json
    payload: "{}"
    timeout: 8
  bug_lizzer_done:
    url: https://ndbanzpiwhaqvtsepszf.supabase.co/rest/v1/rpc/ha_done
    method: POST
    headers:
      apikey: sb_publishable_ShdakQ72QP9DFFyTPcg0_g_IBZBdNcc
      x-ha-token: !secret bug_lizzer_token
    content_type: application/json
    payload: '{"p_id": {{ id }}, "p_result": {{ result | to_json }}}'
  bug_lizzer_today:   # food for the iPad Station (www/station.html)
    url: https://ndbanzpiwhaqvtsepszf.supabase.co/rest/v1/rpc/station_today
    method: POST
    headers:
      apikey: sb_publishable_ShdakQ72QP9DFFyTPcg0_g_IBZBdNcc
      x-ha-token: !secret bug_lizzer_token
    content_type: application/json
    payload: "{}"
    timeout: 8
  bug_lizzer_leftover:   # Station: give a serving of leftovers to someone today
    url: https://ndbanzpiwhaqvtsepszf.supabase.co/rest/v1/rpc/station_leftover
    method: POST
    headers:
      apikey: sb_publishable_ShdakQ72QP9DFFyTPcg0_g_IBZBdNcc
      x-ha-token: !secret bug_lizzer_token
    content_type: application/json
    payload: '{"p_id": {{ id | int }}, "p_person": {{ person | to_json }}, "p_meal": {{ meal | to_json }}}'
    timeout: 8
  bug_lizzer_leftover_remove:   # Station: throw leftovers out
    url: https://ndbanzpiwhaqvtsepszf.supabase.co/rest/v1/rpc/station_leftover_remove
    method: POST
    headers:
      apikey: sb_publishable_ShdakQ72QP9DFFyTPcg0_g_IBZBdNcc
      x-ha-token: !secret bug_lizzer_token
    content_type: application/json
    payload: '{"p_id": {{ id | int }}}'
    timeout: 8
  bug_lizzer_receipt:   # a Fairway receipt email → the app's receipt inbox
    url: https://ndbanzpiwhaqvtsepszf.supabase.co/rest/v1/rpc/ha_receipt
    method: POST
    headers:
      apikey: sb_publishable_ShdakQ72QP9DFFyTPcg0_g_IBZBdNcc
      x-ha-token: !secret bug_lizzer_token
    content_type: application/json
    payload: '{"p_sender": {{ sender | to_json }}, "p_subject": {{ subject | to_json }}, "p_body": {{ body | to_json }}}'
    timeout: 15

input_text:
  bug_lizzer_tv_picture:   # the TV's picture settings while JEOPARDY! has the panel blacked out
    name: TV picture saved by JEOPARDY!
    max: 255


automation:
  # Safety net: if JEOPARDY! ever stops before putting the picture back, fix it within a minute.
  - id: bug_lizzer_tv_picture_safety
    alias: Bug-Lizzer · TV picture never left black
    triggers:
      - trigger: state
        entity_id: script.bug_lizzer_jeopardy
        to: "off"
        for: "00:00:05"
      - trigger: state
        entity_id: media_player.living_room_fish_s_tv
        from: "off"
        for: "00:01:30"
    conditions:
      - condition: template
        value_template: "{{ states('input_text.bug_lizzer_tv_picture') not in ['', 'unknown'] and not is_state('script.bug_lizzer_jeopardy', 'on') and not is_state('media_player.living_room_fish_s_tv', 'off') }}"
    actions:
      - action: script.bug_lizzer_tv_picture_restore

  - id: bug_lizzer_fairway_receipt
    alias: Bug-Lizzer · Fairway receipt email → app
    mode: queued
    triggers:
      - trigger: event
        event_type: imap_content
    conditions:
      - condition: template
        value_template: "{{ 'fairway' in ((trigger.event.data.sender or '') ~ ' ' ~ (trigger.event.data.subject or '')) | lower }}"
    actions:
      - action: rest_command.bug_lizzer_receipt
        data:
          sender: "{{ trigger.event.data.sender }}"
          subject: "{{ trigger.event.data.subject }}"
          body: "{{ trigger.event.data.text }}"
  - id: bug_lizzer_mailbox
    alias: Bug-Lizzer · check the app for requests
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: time_pattern
        seconds: "/3"
    actions:
      - action: rest_command.bug_lizzer_poll
        response_variable: r
        continue_on_error: true
      - condition: template
        value_template: "{{ r is defined and r.status == 200 and (r.content | count) > 0 }}"
      - repeat:
          for_each: "{{ r.content }}"
          sequence:
            - variables:
                script_id: "{{ {'jeopardy': 'script.bug_lizzer_jeopardy', 'rest': 'script.bug_lizzer_rest'}.get(repeat.item.cmd, '') }}"
            - if: "{{ script_id != '' }}"
              then:
                - action: script.turn_on
                  target:
                    entity_id: "{{ script_id }}"
            - action: rest_command.bug_lizzer_done
              data:
                id: "{{ repeat.item.id }}"
                result: "{{ 'Started in Home Assistant' if script_id else 'Home Assistant doesn’t know ' ~ repeat.item.cmd }}"

  - id: bug_lizzer_tv_wake
    alias: Bug-Lizzer · turn on Fish's TV (Wake-on-LAN)
    triggers:
      - trigger: webostv.turn_on
        entity_id: media_player.living_room_fish_s_tv
    actions:
      # The TV has two network addresses (cable and Wi-Fi); wake both, a few times.
      - repeat:
          count: 3
          sequence:
            - repeat:
                for_each: ["AC:5A:F0:54:08:EE", "4C:BA:D7:E7:F6:20"]
                sequence:
                  - action: wake_on_lan.send_magic_packet
                    data:
                      mac: "{{ repeat.item }}"
                      broadcast_address: 192.168.1.255
            - delay:
                milliseconds: 400

script:
  bug_lizzer_jeopardy:
    alias: JEOPARDY!
    icon: mdi:television-classic
    mode: single            # a second tap while it runs is ignored (restarting mid-chase saved the chase colors)
    max_exceeded: silent
    sequence:
      # Remember the room exactly as it is now, before anything changes.
      - variables:
          room_lights: >-
            {{ area_entities('living_room') | select('match', 'light\\.')
               | reject('is_state_attr', 'is_hue_group', true)
               | reject('is_state', 'unavailable') | list }}
          saved: >-
            {% set ns = namespace(l=[]) %}
            {% for e in room_lights %}
              {% set ns.l = ns.l + [{'e': e, 'on': is_state(e, 'on'),
                  'b': state_attr(e, 'brightness') or 0,
                  'xy': state_attr(e, 'xy_color'),
                  'k': state_attr(e, 'color_temp_kelvin'),
                  'mode': state_attr(e, 'color_mode')}] %}
            {% endfor %}
            {{ ns.l }}
      # TV on → Disney+ (NELLY) → Search → type "jeop" → Jeopardy! (1984) → Play (next unwatched episode).
      # Mapped from screenshots of this TV; Disney+ ignores page links on LG, so we use its own search.
      - action: media_player.turn_on
        target:
          entity_id: media_player.living_room_fish_s_tv
      - wait_template: "{{ states('media_player.living_room_fish_s_tv') not in ['off', 'unavailable', 'unknown'] }}"
        timeout: 45
        continue_on_timeout: false
      # Screen off while Disney+ starts loading.
      - repeat:   # the TV refuses this for a moment right after it wakes: retry
          sequence:
            - delay: 1
            - action: webostv.command
              data:
                entity_id: media_player.living_room_fish_s_tv
                command: com.webos.service.tvpower/power/turnOffScreen
              continue_on_error: true
              response_variable: scr
          until: "{{ (scr is defined and scr.get('media_player.living_room_fish_s_tv', {}).get('returnValue')) or repeat.index >= 4 }}"
      - action: media_player.volume_mute
        target:
          entity_id: media_player.living_room_fish_s_tv
        data:
          is_volume_muted: true
        continue_on_error: true
      - action: script.bug_lizzer_disney_to_jeopardy
        continue_on_error: true
      - action: script.bug_lizzer_tv_keys
        data:
          keys: [ENTER]
          gap: 0.1
      - delay: 1.2
      - action: script.bug_lizzer_tv_picture_restore
      - action: media_player.volume_mute
        target:
          entity_id: media_player.living_room_fish_s_tv
        data:
          is_volume_muted: false
        continue_on_error: true
      # Episode starting: Living Room lights chase blue → light blue → white for 10 s, then go back.
      - delay: 2
      - variables:
          colors: [[0.1532, 0.0475], [0.2148, 0.2535], [0.3227, 0.329]]
      - variables:
          chase_end: "{{ as_timestamp(now()) + 10 }}"
      - repeat:
          sequence:
            - variables:
                step: "{{ repeat.index }}"
            - parallel:
                - sequence:
                  - variables:
                      g: >-
                        {% set ns = namespace(l=[]) %}
                        {% for e in room_lights %}{% if (loop.index0 + step) % 3 == 0 %}{% set ns.l = ns.l + [e] %}{% endif %}{% endfor %}
                        {{ ns.l }}
                  - if: "{{ g | count > 0 }}"
                    then:
                      - action: light.turn_on
                        target:
                          entity_id: "{{ g }}"
                        data:
                          xy_color: "{{ colors[0] }}"
                          brightness_pct: 100
                          transition: 0.5
                - sequence:
                  - variables:
                      g: >-
                        {% set ns = namespace(l=[]) %}
                        {% for e in room_lights %}{% if (loop.index0 + step) % 3 == 1 %}{% set ns.l = ns.l + [e] %}{% endif %}{% endfor %}
                        {{ ns.l }}
                  - if: "{{ g | count > 0 }}"
                    then:
                      - action: light.turn_on
                        target:
                          entity_id: "{{ g }}"
                        data:
                          xy_color: "{{ colors[1] }}"
                          brightness_pct: 100
                          transition: 0.5
                - sequence:
                  - variables:
                      g: >-
                        {% set ns = namespace(l=[]) %}
                        {% for e in room_lights %}{% if (loop.index0 + step) % 3 == 2 %}{% set ns.l = ns.l + [e] %}{% endif %}{% endfor %}
                        {{ ns.l }}
                  - if: "{{ g | count > 0 }}"
                    then:
                      - action: light.turn_on
                        target:
                          entity_id: "{{ g }}"
                        data:
                          xy_color: "{{ colors[2] }}"
                          brightness_pct: 100
                          transition: 0.5
            - delay:
                milliseconds: 700
          until: "{{ as_timestamp(now()) >= chase_end }}"
      # Back to exactly how the room was, one light at a time (the Hue bridge drops bursts),
      # then check every light and resend to any that didn't take.
      - delay: 1
      - repeat:
          sequence:
            - variables:
                pass_no: "{{ repeat.index }}"
            - repeat:
                for_each: "{{ saved }}"
                sequence:
                  - variables:
                      x: "{{ repeat.item }}"
                      cur_xy: "{{ state_attr(x.e, 'xy_color') }}"
                      off_ok: "{{ not x.on and is_state(x.e, 'off') }}"
                      on_ok: >-
                        {{ x.on and is_state(x.e, 'on')
                           and ((state_attr(x.e, 'brightness') or 0) - x.b) | abs <= 3
                           and (x.mode == 'color_temp' and ((state_attr(x.e, 'color_temp_kelvin') or 0) - (x.k or 0)) | abs <= 60
                                or x.mode != 'color_temp' and x.xy is not none and cur_xy is not none
                                   and (cur_xy[0] - x.xy[0]) | abs <= 0.01 and (cur_xy[1] - x.xy[1]) | abs <= 0.01
                                or x.mode != 'color_temp' and x.xy is none) }}
                  - if: "{{ pass_no == 1 or not (off_ok or on_ok) }}"
                    then:
                      - choose:
                          - conditions: "{{ not x.on }}"
                            sequence:
                              - action: light.turn_off
                                target: { entity_id: "{{ x.e }}" }
                                data: { transition: 1 }
                          - conditions: "{{ x.mode == 'color_temp' and x.k }}"
                            sequence:
                              - action: light.turn_on
                                target: { entity_id: "{{ x.e }}" }
                                data: { color_temp_kelvin: "{{ x.k }}", brightness: "{{ x.b }}", transition: 1 }
                          - conditions: "{{ x.xy is not none }}"
                            sequence:
                              - action: light.turn_on
                                target: { entity_id: "{{ x.e }}" }
                                data: { xy_color: "{{ x.xy }}", brightness: "{{ x.b }}", transition: 1 }
                        default:
                          - action: light.turn_on
                            target: { entity_id: "{{ x.e }}" }
                            data: { brightness: "{{ x.b }}", transition: 1 }
                      - delay: { milliseconds: 150 }
            - delay: 2.5
          until: >-
            {% set ns = namespace(bad=0) %}
            {% for x in saved %}
              {% set cxy = state_attr(x.e, 'xy_color') %}
              {% if x.on != is_state(x.e, 'on') %}{% set ns.bad = ns.bad + 1 %}
              {% elif x.on and x.mode != 'color_temp' and x.xy is not none and cxy is not none
                     and ((cxy[0] - x.xy[0]) | abs > 0.01 or (cxy[1] - x.xy[1]) | abs > 0.01) %}{% set ns.bad = ns.bad + 1 %}
              {% endif %}
            {% endfor %}
            {{ ns.bad == 0 or repeat.index >= 4 }}

  bug_lizzer_disney_to_jeopardy:
    alias: Bug-Lizzer · Disney+ → NELLY → JEOPARDY! page
    mode: single
    sequence:
      # Always restart Disney+: a TV that was switched off keeps it in the background on whatever
      # screen it was left on, and the remote presses below must start from its home screen.
      - action: webostv.command
        data:
          entity_id: media_player.living_room_fish_s_tv
          command: system.launcher/close
          payload:
            id: com.disney.disneyplus-prod
        continue_on_error: true
      - delay: 0.8
      - action: webostv.command
        data:
          entity_id: media_player.living_room_fish_s_tv
          command: system.launcher/launch
          payload:
            id: com.disney.disneyplus-prod
      - wait_template: "{{ state_attr('media_player.living_room_fish_s_tv', 'source') == 'Disney+' }}"
        timeout: 15
      # Opening Disney+ lights the screen: switch it straight back off while the blackout is applied.
      - action: webostv.command
        data:
          entity_id: media_player.living_room_fish_s_tv
          command: com.webos.service.tvpower/power/turnOffScreen
        continue_on_error: true
      # Black out the panel now that Disney+ is in front (the TV keeps picture settings per app):
      # the remote presses below then happen on a black screen; the picture comes back at Play.
      - action: script.bug_lizzer_tv_blackout
      - delay: 9   # Disney+ loading its home screen
      # Disney+ opens on whoever watched last: always switch to NELLY (2nd on "Who's watching?").
      # Top tabs → side menu → profile/SWITCH at its top.
      - action: script.bug_lizzer_tv_keys
        data:
          keys: [UP, UP, LEFT, UP, UP, ENTER]
          gap: 0.7
      - delay: 1.5
      # The picker opens on the current profile: go to the first, then one right = NELLY.
      - action: script.bug_lizzer_tv_keys
        data:
          keys: [LEFT, LEFT, LEFT, RIGHT, ENTER]
          gap: 0.6
      - delay: 7   # NELLY's home screen loading
      # Top tabs → side menu (opens on Home) → Search (keyboard opens with the cursor on the space bar)
      - action: script.bug_lizzer_tv_keys
        data:
          keys: [UP, UP, LEFT, UP, ENTER]
          gap: 0.7
      - delay: 1
      # space → e, then j-e-o-p
      - action: script.bug_lizzer_tv_keys
        data:
          keys: [DOWN, DOWN, LEFT, ENTER, UP, RIGHT, ENTER, DOWN, DOWN, LEFT, LEFT, ENTER, RIGHT, ENTER]
          gap: 0.35
      - delay: 2
      # keyboard → first result, Jeopardy! (1984) → its page → Play
      - action: script.bug_lizzer_tv_keys
        data:
          keys: [UP, UP, RIGHT, RIGHT, RIGHT]
          gap: 0.35
      - delay: 0.8
      - action: script.bug_lizzer_tv_keys
        data:
          keys: [ENTER]
          gap: 0.1
      - delay: 5   # the show's page loading; pressing earlier does nothing



  # Run a TV system command Home Assistant isn't normally allowed to (picture settings): LG TVs
  # run the command attached to a notice when the notice is closed, so open one and close it.
  bug_lizzer_tv_luna:
    alias: Bug-Lizzer · TV system command
    mode: queued
    fields:
      uri: {description: "luna:// address"}
      params: {description: "Its parameters"}
    sequence:
      - action: webostv.command
        data:
          entity_id: media_player.living_room_fish_s_tv
          command: system.notifications/createAlert
          payload:
            message: " "
            type: confirm
            isSysReq: true
            buttons: [{label: "ok", onClick: "{{ uri }}", params: "{{ params }}"}]
            onclose: {uri: "{{ uri }}", params: "{{ params }}"}
            onfail: {uri: "{{ uri }}", params: "{{ params }}"}
        response_variable: alert
      - delay: {milliseconds: 200}
      - action: webostv.command
        data:
          entity_id: media_player.living_room_fish_s_tv
          command: system.notifications/closeAlert
          payload:
            alertId: "{{ alert['media_player.living_room_fish_s_tv'].alertId }}"

  bug_lizzer_tv_blackout:
    alias: Bug-Lizzer · TV picture to black (saving it first)
    sequence:
      - if: "{{ states('input_text.bug_lizzer_tv_picture') in ['', 'unknown'] }}"
        then:
          - action: webostv.command
            data:
              entity_id: media_player.living_room_fish_s_tv
              command: settings/getSystemSettings
              payload: {category: picture, keys: [backlight, contrast, brightness]}
            response_variable: pic
          - action: input_text.set_value
            target: {entity_id: input_text.bug_lizzer_tv_picture}
            data:
              value: "{{ pic['media_player.living_room_fish_s_tv'].settings | to_json }}"
      - action: script.bug_lizzer_tv_luna
        data:
          uri: luna://com.webos.settingsservice/setSystemSettings
          params: {category: picture, settings: {backlight: 0, contrast: 0, brightness: 0}}

  bug_lizzer_tv_picture_restore:
    alias: Bug-Lizzer · TV picture back to normal
    sequence:
      - condition: template
        value_template: "{{ states('input_text.bug_lizzer_tv_picture') not in ['', 'unknown'] }}"
      - action: script.bug_lizzer_tv_luna
        data:
          uri: luna://com.webos.settingsservice/setSystemSettings
          params: "{{ {'category': 'picture', 'settings': states('input_text.bug_lizzer_tv_picture') | from_json} }}"
      - action: input_text.set_value
        target: {entity_id: input_text.bug_lizzer_tv_picture}
        data: {value: ""}

  bug_lizzer_tv_keys:
    alias: Bug-Lizzer · press TV remote buttons
    mode: queued
    fields:
      keys:
        description: Remote buttons in order (LEFT, RIGHT, UP, DOWN, ENTER, BACK, HOME …)
      gap:
        description: Seconds between presses
        default: 0.5
    sequence:
      - repeat:
          for_each: "{{ keys }}"
          sequence:
            - action: webostv.button
              data:
                entity_id: media_player.living_room_fish_s_tv
                button: "{{ repeat.item }}"
            - delay: "{{ gap | default(0.5) | float }}"

  bug_lizzer_rest:
    alias: Rest Mode
    icon: mdi:weather-night
    mode: restart
    sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.home_rest
        data:
          transition: 2
      - action: media_player.turn_off
        target:
          entity_id: media_player.living_room_fish_s_tv
        continue_on_error: true
