# Bug-Lizzer Planning ⇄ Home Assistant
# Home Assistant checks the app's mailbox every 3 seconds (it only reaches out; nothing comes in),
# runs the matching script here on the home network, and reports back.
# Needs `bug_lizzer_token` in secrets.yaml.

wake_on_lan:   # lets Home Assistant switch the LG TV on

rest_command:
  bug_lizzer_poll:
    url: https://ndbanzpiwhaqvtsepszf.supabase.co/rest/v1/rpc/ha_poll
    method: POST
    headers:
      apikey: sb_publishable_ShdakQ72QP9DFFyTPcg0_g_IBZBdNcc
      x-ha-token: !secret bug_lizzer_token
    content_type: application/json
    payload: "{}"
    timeout: 8
  bug_lizzer_done:
    url: https://ndbanzpiwhaqvtsepszf.supabase.co/rest/v1/rpc/ha_done
    method: POST
    headers:
      apikey: sb_publishable_ShdakQ72QP9DFFyTPcg0_g_IBZBdNcc
      x-ha-token: !secret bug_lizzer_token
    content_type: application/json
    payload: '{"p_id": {{ id }}, "p_result": {{ result | to_json }}}'

automation:
  - id: bug_lizzer_mailbox
    alias: Bug-Lizzer · check the app for requests
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: time_pattern
        seconds: "/3"
    actions:
      - action: rest_command.bug_lizzer_poll
        response_variable: r
        continue_on_error: true
      - condition: template
        value_template: "{{ r is defined and r.status == 200 and (r.content | count) > 0 }}"
      - repeat:
          for_each: "{{ r.content }}"
          sequence:
            - variables:
                script_id: "{{ {'jeopardy': 'script.bug_lizzer_jeopardy', 'rest': 'script.bug_lizzer_rest'}.get(repeat.item.cmd, '') }}"
            - if: "{{ script_id != '' }}"
              then:
                - action: script.turn_on
                  target:
                    entity_id: "{{ script_id }}"
            - action: rest_command.bug_lizzer_done
              data:
                id: "{{ repeat.item.id }}"
                result: "{{ 'Started in Home Assistant' if script_id else 'Home Assistant doesn’t know ' ~ repeat.item.cmd }}"

  - id: bug_lizzer_tv_wake
    alias: Bug-Lizzer · turn on Fish's TV (Wake-on-LAN)
    triggers:
      - trigger: webostv.turn_on
        entity_id: media_player.living_room_fish_s_tv
    actions:
      # The TV has two network addresses (cable and Wi-Fi); wake both, a few times.
      - repeat:
          count: 3
          sequence:
            - repeat:
                for_each: ["AC:5A:F0:54:08:EE", "4C:BA:D7:E7:F6:20"]
                sequence:
                  - action: wake_on_lan.send_magic_packet
                    data:
                      mac: "{{ repeat.item }}"
                      broadcast_address: 192.168.1.255
            - delay:
                milliseconds: 400

script:
  bug_lizzer_jeopardy:
    alias: JEOPARDY!
    icon: mdi:television-classic
    mode: restart
    sequence:
      - variables:
          room_lights: >-
            {{ area_entities('living_room') | select('match', 'light\\.')
               | reject('is_state_attr', 'is_hue_group', true)
               | reject('is_state', 'unavailable') | list }}
          colors: [[0.1532, 0.0475], [0.2148, 0.2535], [0.3227, 0.329]]
      - parallel:
          # Every light in the Living Room area chases blue → light blue → white for 30 s, then goes back to how it was.
          - sequence:
              - action: scene.create
                data:
                  scene_id: bug_lizzer_before_jeopardy
                  snapshot_entities: "{{ room_lights }}"
              - repeat:
                  count: 30
                  sequence:
                    - variables:
                        step: "{{ repeat.index }}"
                    - repeat:
                        for_each: [0, 1, 2]
                        sequence:
                          - variables:
                              group: >-
                                {% set ns = namespace(l=[]) %}
                                {% for e in room_lights %}{% if (loop.index0 + step) % 3 == repeat.item %}{% set ns.l = ns.l + [e] %}{% endif %}{% endfor %}
                                {{ ns.l }}
                          - if: "{{ group | count > 0 }}"
                            then:
                              - action: light.turn_on
                                target:
                                  entity_id: "{{ group }}"
                                data:
                                  xy_color: "{{ colors[repeat.item] }}"
                                  brightness_pct: 100
                                  transition: 0.6
                    - delay: 1
              - action: scene.turn_on
                target:
                  entity_id: scene.bug_lizzer_before_jeopardy
                data:
                  transition: 1
          # TV on → fresh Disney+ (NELLY) → Search → type "jeop" → Jeopardy! (1984) → Play (next unwatched episode).
          # Mapped from screenshots of this TV; Disney+ ignores page links on LG, so we use its own search.
          - sequence:
              - action: media_player.turn_on
                target:
                  entity_id: media_player.living_room_fish_s_tv
              - wait_template: "{{ states('media_player.living_room_fish_s_tv') not in ['off', 'unavailable', 'unknown'] }}"
                timeout: 45
                continue_on_timeout: false
              - delay: 3
              - action: webostv.command
                data:
                  entity_id: media_player.living_room_fish_s_tv
                  command: system.launcher/close
                  payload:
                    id: com.disney.disneyplus-prod
                continue_on_error: true
              - delay: 2.5
              - action: webostv.command
                data:
                  entity_id: media_player.living_room_fish_s_tv
                  command: system.launcher/launch
                  payload:
                    id: com.disney.disneyplus-prod
              - delay: 13
              # Menu → Search (the keyboard opens with the cursor on the space bar)
              - action: script.bug_lizzer_tv_keys
                data:
                  keys: [LEFT, UP, ENTER]
                  gap: 1.3
              - delay: 1.5
              # space → e, then j-e-o-p
              - action: script.bug_lizzer_tv_keys
                data:
                  keys: [DOWN, DOWN, LEFT, ENTER, UP, RIGHT, ENTER, DOWN, DOWN, LEFT, LEFT, ENTER, RIGHT, ENTER]
                  gap: 0.45
              - delay: 3
              # keyboard → first result, Jeopardy! (1984) → its page → Play
              - action: script.bug_lizzer_tv_keys
                data:
                  keys: [UP, UP, RIGHT, RIGHT, RIGHT]
                  gap: 0.45
              - delay: 1.2
              - action: script.bug_lizzer_tv_keys
                data:
                  keys: [ENTER]
                  gap: 0.1
              - delay: 4
              - action: script.bug_lizzer_tv_keys
                data:
                  keys: [ENTER]
                  gap: 0.1

  bug_lizzer_tv_keys:
    alias: Bug-Lizzer · press TV remote buttons
    mode: queued
    fields:
      keys:
        description: Remote buttons in order (LEFT, RIGHT, UP, DOWN, ENTER, BACK, HOME …)
      gap:
        description: Seconds between presses
        default: 0.5
    sequence:
      - repeat:
          for_each: "{{ keys }}"
          sequence:
            - action: webostv.button
              data:
                entity_id: media_player.living_room_fish_s_tv
                button: "{{ repeat.item }}"
            - delay: "{{ gap | default(0.5) | float }}"

  bug_lizzer_rest:
    alias: Rest Mode
    icon: mdi:weather-night
    mode: restart
    sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.home_rest
        data:
          transition: 2
      - action: media_player.turn_off
        target:
          entity_id: media_player.living_room_fish_s_tv
        continue_on_error: true
