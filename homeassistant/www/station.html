<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Station">
<title>Bug-Lizzer Station</title>
<!--
  Bug-Lizzer Station: a wall/counter panel for an old iPad (built for iOS 12 Safari).
  Served by Home Assistant from /config/www, talks to Home Assistant directly on the home network.
  Written without newer JavaScript (no ?. or ??) and without flexbox gap, which iOS 12 lacks.
-->
<style>
  :root{ --bg:#0f1512; --card:#18201c; --card2:#1f2924; --ink:#e7ece8; --muted:#9ba69f; --line:#29332e;
         --green:#4a9a72; --amber:#d7a64c; --red:#e2604f; --amy:#e6bd3f; --parker:#f06b5b; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; background:var(--bg); color:var(--ink);
    font:17px/1.35 -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif; -webkit-user-select:none; user-select:none; overflow:hidden; }
  body.night{ --ink:#8e9891; --muted:#5f6963; --card:#121815; --card2:#161d19; }
  /* Light mode (tap the clock to switch) */
  body.light{ --bg:#f3f5f1; --card:#ffffff; --card2:#f7f9f6; --ink:#17211c; --muted:#66706a; --line:#dfe4dd;
              --green:#2f6b4f; --amber:#b9862b; --red:#c23b2b; --amy:#b88a00; --parker:#c4382b; }
  body.light .room.on{ background:#e6f1dc; border-color:#a9c98f; }
  body.light .room.on small{ color:#3f6b2a; }
  body.light .toast{ background:#17211c; }
  button.clockcard{ display:block; width:100%; text-align:left; min-height:0; padding:12px 14px; border-radius:18px; background:var(--card); }
  .themehint{ float:right; font-size:22px; opacity:.7; }
  .wrap{ display:grid; grid-template-columns: 30% 34% 1fr; grid-gap:14px; height:100%; padding:16px 18px; }
  .col{ display:grid; grid-gap:14px; align-content:start; overflow:hidden; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:18px; padding:12px 14px; }
  h2{ margin:0 0 10px; font-size:13px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-weight:600; }
  .clock{ font-size:66px; font-weight:200; letter-spacing:-2px; line-height:1; }
  .date{ font-size:17px; color:var(--muted); margin-top:4px; }
  .wx{ font-size:15px; color:var(--ink); margin-top:6px; }
  .row{ display:table; width:100%; font-size:15px; padding:5px 0; border-top:1px solid var(--line); }
  .row:first-of-type{ border-top:0; }
  .row > span{ display:table-cell; vertical-align:top; }
  .row .k{ width:58px; color:var(--muted); font-weight:600; }
  .row.today .k, .row.today .v{ color:var(--green); font-weight:700; }
  .row .v.none{ color:var(--muted); }
  .chips span{ display:inline-block; font-size:14px; background:var(--card2); border:1px solid var(--line); border-radius:99px; padding:3px 9px; margin:0 5px 5px 0; }
  .chips span.now{ border-color:var(--amber); color:var(--amber); }
  .ev{ font-size:15px; padding:5px 0; border-top:1px solid var(--line); }
  .ev:first-of-type{ border-top:0; }
  .ev b{ font-weight:600; } .ev small{ display:block; color:var(--muted); font-size:13px; }
  .dinner{ font-size:21px; font-weight:600; }
  .sub{ color:var(--muted); font-size:15px; margin-top:4px; }
  .person{ border-left:4px solid; padding:6px 0 6px 12px; margin-top:10px; }
  .person b{ display:block; font-size:15px; }
  .person span{ display:block; font-size:16px; }
  .grid{ display:grid; grid-gap:10px; }
  .g2{ grid-template-columns:1fr 1fr; } .g3{ grid-template-columns:1fr 1fr 1fr; } .g4{ grid-template-columns:1fr 1fr 1fr 1fr; }
  button{ font:inherit; color:var(--ink); background:var(--card2); border:1px solid var(--line); border-radius:14px;
          padding:12px 8px; min-height:56px; cursor:pointer; text-align:center; }
  button:active{ transform:scale(.97); opacity:.85; }
  .scene{ font-size:18px; font-weight:600; min-height:74px; }
  .scene i{ display:block; font-style:normal; font-size:28px; margin-bottom:4px; }
  .room{ text-align:left; min-height:62px; padding:10px 12px; }
  .room b{ display:block; font-size:17px; }
  .room small{ color:var(--muted); font-size:14px; }
  .room.on{ background:#2b3a22; border-color:#4d6b33; }
  .room.on small{ color:#c9e3a8; }
  .tv button{ font-size:22px; }
  .busy{ opacity:.5; }
  .toast{ position:fixed; left:50%; bottom:24px; -webkit-transform:translateX(-50%); transform:translateX(-50%);
          background:#2b3d34; color:#fff; padding:12px 20px; border-radius:14px; font-size:16px; opacity:0; -webkit-transition:opacity .3s; transition:opacity .3s; }
  .toast.show{ opacity:1; }
  .leftbtn{ display:block; width:100%; text-align:left; min-height:0; padding:8px 10px; margin-top:6px; border-radius:12px; }
  .leftbtn small{ display:block; color:var(--muted); font-size:13px; }
  .modal{ position:fixed; left:0; top:0; right:0; bottom:0; background:rgba(0,0,0,.55); z-index:50; }
  .modal .box{ position:absolute; left:50%; top:50%; width:560px; margin-left:-280px; -webkit-transform:translateY(-50%); transform:translateY(-50%);
               background:var(--card); border:1px solid var(--line); border-radius:22px; padding:20px 22px; }
  .modal h3{ margin:0 0 4px; font-size:22px; } .modal .sub{ margin-bottom:12px; }
  .modal .who{ font-weight:700; margin:12px 0 6px; }
  .modal .actions{ display:table; width:100%; margin-top:16px; } .modal .actions > *{ display:table-cell; }
  .setup{ max-width:620px; margin:60px auto; padding:0 24px; }
  .setup textarea{ width:100%; height:140px; font:14px Menlo, monospace; background:var(--card); color:var(--ink);
                   border:1px solid var(--line); border-radius:12px; padding:12px; margin:12px 0; -webkit-user-select:text; user-select:text; }
  .setup li{ margin:6px 0; }
  .err{ color:var(--red); }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
(function(){
  'use strict';
  var VERSION = 'station-7';   // bump when the page changes; open iPads reload themselves
  var TV = 'media_player.living_room_fish_s_tv';
  var HIDE_SCRIPTS = ['script.bug_lizzer_tv_keys'];
  var ICONS = { 'script.bug_lizzer_jeopardy':'🎯', 'script.bug_lizzer_rest':'🌙' };
  var token = null, states = {}, rooms = [], food = null, lastErr = '', events = [], forecast = null, leftModal = null;

  try { token = localStorage.getItem('station_token'); } catch(e) {}
  // If this iPad has signed in to Home Assistant in Safari, use that sign-in.
  function haLogin(){ try { var t = JSON.parse(localStorage.getItem('hassTokens') || 'null'); return t && t.access_token ? t : null; } catch(e) { return null; } }

  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function toast(msg){ var t = $('toast'); t.textContent = msg; t.className = 'toast show'; clearTimeout(toast.t); toast.t = setTimeout(function(){ t.className = 'toast'; }, 2500); }

  function bearer(){ if (token) return token; var l = haLogin(); return l ? l.access_token : null; }
  function api(method, path, body){
    return fetch('/api/' + path, { method: method, headers: { 'Authorization': 'Bearer ' + bearer(), 'Content-Type': 'application/json' },
      body: body ? JSON.stringify(body) : undefined })
      .then(function(r){ if (r.status === 401) { throw new Error('auth'); } if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
  }
  function call(domain, service, data){ return api('POST', 'services/' + domain + '/' + service, data || {}); }

  // ---------- first run: paste a Home Assistant access token ----------
  function setup(msg){
    $('app').innerHTML =
      '<div class="setup"><h1>Bug-Lizzer Station</h1>' + (msg ? '<p class="err">' + esc(msg) + '</p>' : '') +
      '<p>This iPad needs a Home Assistant access code once:</p><ol>' +
      '<li>On your phone or PC, open Home Assistant → your name (bottom left) → <b>Security</b>.</li>' +
      '<li>Under <b>Long-lived access tokens</b>, tap <b>Create token</b>, name it “iPad Station”, and copy it.</li>' +
      '<li>Paste it below (with an iPhone nearby on the same Apple ID, copying on the phone lets you paste here).</li></ol>' +
      '<textarea id="tok" placeholder="Paste the token here" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>' +
      '<button id="save" style="width:100%">Save on this iPad</button></div>';
    $('save').onclick = function(){ var v = $('tok').value.replace(/\s+/g, ''); if (!v) return;
      token = v; try { localStorage.setItem('station_token', v); } catch(e) {} start(); };
  }

  // ---------- data ----------
  var ROOMS_TPL = "{% set ns = namespace(o=[]) %}{% for a in areas() %}" +
    "{% set ls = area_entities(a) | select('match','light\\.') | reject('is_state_attr','is_hue_group',true) | list %}" +
    "{% set sc = area_entities(a) | select('match','scene\\.') | list %}" +
    "{% if ls %}{% set ns.o = ns.o + [{'id':a,'name':area_name(a),'lights':ls,'scenes':sc[:4]}] %}{% endif %}{% endfor %}{{ ns.o | to_json }}";

  function loadRooms(){ return api('POST', 'template', { template: ROOMS_TPL }).then(function(t){ rooms = typeof t === 'string' ? JSON.parse(t) : t; }); }
  function loadStates(){ return api('GET', 'states').then(function(list){ var m = {}; list.forEach(function(s){ m[s.entity_id] = s; }); states = m; }); }
  var WX = { 'sunny':'☀️','clear-night':'🌙','partlycloudy':'⛅','cloudy':'☁️','rainy':'🌧️','pouring':'🌧️','snowy':'❄️','snowy-rainy':'🌨️',
             'fog':'🌫️','hail':'🌨️','lightning':'🌩️','lightning-rainy':'⛈️','windy':'💨','windy-variant':'💨','exceptional':'⚠️' };
  function weatherEntity(){ var k = Object.keys(states).filter(function(e){ return e.indexOf('weather.') === 0; }); return k[0]; }
  function loadForecast(){
    var w = weatherEntity(); if (!w) return Promise.resolve();
    return api('POST', 'services/weather/get_forecasts?return_response', { entity_id: w, type: 'daily' })
      .then(function(r){ var f = r && r.service_response && r.service_response[w]; forecast = f && f.forecast ? f.forecast : null; })
      .catch(function(){});
  }
  function loadEvents(){
    var cals = Object.keys(states).filter(function(e){ return e.indexOf('calendar.') === 0; });
    if (!cals.length) { events = []; return Promise.resolve(); }
    var start = new Date(), end = new Date(start.getTime() + 8 * 864e5);
    return Promise.all(cals.map(function(c){
      return api('GET', 'calendars/' + c + '?start=' + encodeURIComponent(start.toISOString()) + '&end=' + encodeURIComponent(end.toISOString())).catch(function(){ return []; });
    })).then(function(lists){
      var all = []; lists.forEach(function(l){ all = all.concat(l || []); });
      all.forEach(function(e){ e._t = new Date(e.start.dateTime || (e.start.date + 'T00:00:00')).getTime(); e._allDay = !e.start.dateTime; });
      all.sort(function(a, b){ return a._t - b._t; });
      events = all;
    });
  }
  function loadFood(){
    return api('POST', 'services/rest_command/bug_lizzer_today?return_response', {})
      .then(function(r){ var sr = r && r.service_response; if (sr && sr.status === 200) food = sr.content; })
      .catch(function(){});
  }

  // ---------- render ----------
  function pad(n){ return (n < 10 ? '0' : '') + n; }
  function cleanWhat(w){ return String(w || '').replace(/ —$/, '').replace(/ — /, ' · '); }

  function render(){
    var now = new Date(), h = now.getHours();
    var light = false; try { light = localStorage.getItem('station_theme') === 'light'; } catch(e) {}
    document.body.className = light ? 'light' : ((h >= 22 || h < 6) ? 'night' : '');
    var days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    var months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    var hh = h % 12 || 12;

    // The clock is a real button: tap it to switch dark ⇄ light.
    // ---- column 1: clock + weather, tonight, people, leftovers ----
    var w = states[weatherEntity()], wx = '';
    if (w) {
      var t0 = forecast && forecast[0];
      wx = '<div class="wx">' + (WX[w.state] || '') + ' ' + Math.round(w.attributes.temperature) + '°' +
           (t0 ? ' · H ' + Math.round(t0.temperature) + '° L ' + Math.round(t0.templow) + '°' : '') + '</div>';
    }
    // The clock is a real button: tap it to switch dark ⇄ light.
    var c1 = '<button class="card clockcard" data-theme-toggle="1"><div class="clock">' + hh + ':' + pad(now.getMinutes()) + '</div>' +
      '<div class="date">' + days[now.getDay()] + ', ' + months[now.getMonth()] + ' ' + now.getDate() +
      '<span class="themehint">' + (light ? '🌙' : '☀️') + '</span></div>' + wx + '</button>';

    var sum = food && food.summary, din = food && food.dinner;
    var missing = sum && sum.buy ? sum.buy.filter(function(x){ return x.tonight; }).map(function(x){ return x.i; }) : [];
    c1 += '<div class="card"><h2>Tonight</h2>' +
      (din ? '<div class="dinner">' + (din.leftovers ? '🍱 ' : '') + esc(cleanWhat(din.what)) + '</div>' +
             (din.cooked ? '<div class="sub">✓ Cooked</div>' : missing.length ? '<div class="sub" style="color:var(--amber)">Still need: ' + esc(missing.join(', ')) + '</div>' : '')
           : '<div class="dinner" style="color:var(--muted)">Nothing planned</div>');
    ['Amy', 'Parker'].forEach(function(p){
      var items = (food && food.meals || []).filter(function(m){ return m.person === p; });
      c1 += '<div class="person" style="border-color:var(--' + p.toLowerCase() + ')"><b style="color:var(--' + p.toLowerCase() + ')">' + p + '</b>' +
        (items.length ? items.map(function(m){ return '<span>' + esc(m.meal === 'snack' ? 'Snack' : m.meal.charAt(0).toUpperCase() + m.meal.slice(1)) + ': ' + esc(cleanWhat(m.what)) + '</span>'; }).join('')
                      : '<span style="color:var(--muted)">Nothing logged yet</span>') + '</div>';
    });
    c1 += '</div>';
    if (sum && sum.left && sum.left.length) {
      c1 += '<div class="card"><h2>Leftovers · tap to give or toss</h2>' + sum.left.slice(0, 4).map(function(l){
        return '<button class="leftbtn" data-left="' + l.id + '"><b>🍱 ' + esc(l.what) + '</b><small>' + l.servings + ' serving' + (l.servings === 1 ? '' : 's') + ' · from ' + esc(l.from) + '</small></button>'; }).join('') + '</div>';
    }

    // ---- column 2: this week's dinners, calendar, shopping ----
    var todayIso = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate());
    var c2 = '<div class="card"><h2>Dinners this week</h2>' + (sum && sum.dinners ? sum.dinners.map(function(d){
      var ic = d.kind === 'leftovers' ? '🍱 ' : d.kind === 'scrunge' ? '🫙 ' : d.kind === 'out' ? '🍽️ ' : '';
      return '<div class="row' + (d.d === todayIso ? ' today' : '') + '"><span class="k">' + esc(d.day) + '</span><span class="v' + (d.what ? '' : ' none') + '">' +
        (d.what ? ic + esc(cleanWhat(d.what)) + (d.cooked ? ' ✓' : '') : '—') + '</span></div>'; }).join('')
      : '<div class="sub">Open the Bug-Lizzer app once to fill this in.</div>') + '</div>';

    if (events.length) {
      var upcoming = events.filter(function(e){ return e._allDay ? e._t >= new Date(todayIso + 'T00:00:00').getTime() : e._t >= now.getTime() - 3600e3; }).slice(0, 5);
      c2 += '<div class="card"><h2>Coming up</h2>' + (upcoming.length ? upcoming.map(function(e){
        var d = new Date(e._t), isToday = d.toDateString() === now.toDateString();
        var tomorrow = new Date(now.getTime() + 864e5).toDateString() === d.toDateString();
        var when = isToday ? 'Today' : tomorrow ? 'Tomorrow' : days[d.getDay()].slice(0, 3) + ' ' + months[d.getMonth()].slice(0, 3) + ' ' + d.getDate();
        if (!e._allDay) when += ' · ' + ((d.getHours() % 12) || 12) + ':' + pad(d.getMinutes()) + (d.getHours() < 12 ? ' AM' : ' PM');
        return '<div class="ev"><b>' + esc(e.summary || 'Event') + '</b><small>' + when + '</small></div>'; }).join('')
        : '<div class="sub">Nothing in the next week</div>') + '</div>';
    }

    if (sum && sum.buy) {
      c2 += '<div class="card"><h2>Shopping · ' + (sum.buy.length ? sum.buy.length + ' to get' : 'all set') + '</h2><div class="chips">' +
        sum.buy.slice(0, 14).map(function(x){ return '<span' + (x.tonight ? ' class="now"' : '') + '>' + esc(x.i) + '</span>'; }).join('') +
        (sum.buy.length > 14 ? '<span>+' + (sum.buy.length - 14) + ' more</span>' : '') + '</div>' +
        '<div class="sub">' + sum.home + ' things at home</div></div>';
    }

    // ---- column 3: scenes, lights, TV ----
    // Only the real scenes: JEOPARDY!, Rest Mode and anything you make yourself. Bug-Lizzer's own
    // helper steps (Disney+ navigation, TV picture, remote presses…) stay hidden.
    var scripts = Object.keys(states).filter(function(e){
      if (e.indexOf('script.') !== 0 || HIDE_SCRIPTS.indexOf(e) >= 0) return false;
      if (states[e].state === 'unavailable') return false;
      return e.indexOf('script.bug_lizzer_') !== 0 || !!ICONS[e];
    });
    scripts.sort(function(a, b){ return (ICONS[b] ? 1 : 0) - (ICONS[a] ? 1 : 0) || a.localeCompare(b); });
    var c3 = '<div class="card"><h2>Scenes</h2><div class="grid g2">' +
      scripts.map(function(e){ var st = states[e]; return '<button class="scene" data-script="' + e + '"><i>' + (ICONS[e] || '✨') + '</i>' +
        esc(st.attributes.friendly_name || e) + '</button>'; }).join('') + '</div></div>';

    c3 += '<div class="card"><h2>Lights</h2><div class="grid g2">' + rooms.map(function(r){
      var on = r.lights.filter(function(l){ return states[l] && states[l].state === 'on'; }).length;
      return '<button class="room' + (on ? ' on' : '') + '" data-room="' + esc(r.id) + '"><b>' + esc(r.name) + '</b><small>' +
        (on ? on + ' of ' + r.lights.length + ' on' : 'Off') + '</small></button>';
    }).join('') + '</div></div>';

    var tv = states[TV], tvOn = tv && tv.state !== 'off' && tv.state !== 'unavailable';
    c3 += '<div class="card tv"><h2>TV' + (tvOn && tv.attributes.source ? ' · ' + esc(tv.attributes.source) : '') + '</h2><div class="grid g4">' +
      '<button data-tv="power">' + (tvOn ? '⏻ Off' : '⏻ On') + '</button><button data-tv="down">🔉</button><button data-tv="mute">🔇</button><button data-tv="up">🔊</button></div></div>';

    var lm = leftModal && sum && sum.left ? sum.left.filter(function(x){ return String(x.id) === String(leftModal); })[0] : null;
    var modal = lm ? '<div class="modal" data-modalbg="1"><div class="box"><h3>🍱 ' + esc(lm.what) + '</h3><div class="sub">' + lm.servings + ' serving' + (lm.servings === 1 ? '' : 's') + ' left · from ' + esc(lm.from) + '. Give one serving to:</div>' +
      ['Amy', 'Parker'].map(function(p){ return '<div class="who" style="color:var(--' + p.toLowerCase() + ')">' + p + '</div><div class="grid g3">' +
        [['breakfast','Breakfast'],['lunch','Lunch'],['snack','Snack']].map(function(m){ return '<button data-give="' + lm.id + '|' + p + '|' + m[0] + '">' + m[1] + '</button>'; }).join('') + '</div>'; }).join('') +
      '<div class="grid g2" style="margin-top:16px"><button data-toss="' + lm.id + '" style="color:var(--red)">🗑 Throw out</button><button data-close="1">Cancel</button></div></div></div>' : '';
    $('app').innerHTML = modal + '<div class="wrap"><div class="col">' + c1 + '</div><div class="col">' + c2 + '</div><div class="col">' + c3 + '</div></div>' +
      (lastErr ? '<div style="position:fixed;top:6px;right:12px;color:var(--red);font-size:13px">' + esc(lastErr) + '</div>' : '');
  }

  // ---------- taps ----------
  document.addEventListener('click', function(ev){
    if (ev.target && ev.target.getAttribute && ev.target.getAttribute('data-modalbg')) { leftModal = null; render(); return; }
    var b = ev.target; while (b && b.tagName !== 'BUTTON') b = b.parentNode; if (!b || !b.getAttribute) return;
    var p;
    if (b.getAttribute('data-theme-toggle')) { flipTheme(); return; }
    if (b.getAttribute('data-left')) { leftModal = b.getAttribute('data-left'); render(); return; }
    if (b.getAttribute('data-close')) { leftModal = null; render(); return; }
    if (b.getAttribute('data-give') || b.getAttribute('data-toss')) {
      var g = (b.getAttribute('data-give') || '').split('|'), tossId = b.getAttribute('data-toss');
      var req = tossId ? call('rest_command', 'bug_lizzer_leftover_remove', { id: +tossId })
                       : call('rest_command', 'bug_lizzer_leftover', { id: +g[0], person: g[1], meal: g[2] });
      b.className += ' busy';
      req.then(function(){ toast(tossId ? 'Thrown out' : '🍱 ' + g[1] + '’s ' + g[2] + ' today'); leftModal = null; return loadFood(); })
         .then(render, function(){ toast('Couldn’t save that — try again'); render(); });
      return;
    }
    if (b.getAttribute('data-script')) {
      var e = b.getAttribute('data-script'); b.className += ' busy';
      p = call('script', 'turn_on', { entity_id: e }).then(function(){ toast((states[e].attributes.friendly_name || 'Scene') + ' started'); });
    } else if (b.getAttribute('data-room')) {
      var r = rooms.filter(function(x){ return x.id === b.getAttribute('data-room'); })[0]; if (!r) return;
      var anyOn = r.lights.some(function(l){ return states[l] && states[l].state === 'on'; });
      p = call('light', anyOn ? 'turn_off' : 'turn_on', { entity_id: r.lights });
      r.lights.forEach(function(l){ if (states[l]) states[l].state = anyOn ? 'off' : 'on'; }); render();
    } else if (b.getAttribute('data-tv')) {
      var a = b.getAttribute('data-tv'), tv = states[TV], tvOn = tv && tv.state !== 'off' && tv.state !== 'unavailable';
      if (a === 'power') p = call('media_player', tvOn ? 'turn_off' : 'turn_on', { entity_id: TV });
      if (a === 'up') p = call('media_player', 'volume_up', { entity_id: TV });
      if (a === 'down') p = call('media_player', 'volume_down', { entity_id: TV });
      if (a === 'mute') p = call('media_player', 'volume_mute', { entity_id: TV, is_volume_muted: !(tv && tv.attributes.is_volume_muted) });
    }
    if (p) p.then(function(){ setTimeout(refresh, 800); }, function(err){ toast(err.message === 'auth' ? 'Access code rejected' : 'Couldn’t reach Home Assistant'); });
  });

  function flipTheme(){ var cur = 'dark'; try { cur = localStorage.getItem('station_theme') || 'dark'; localStorage.setItem('station_theme', cur === 'light' ? 'dark' : 'light'); } catch(e) {}
    render(); toast(cur === 'light' ? 'Dark mode' : 'Light mode'); }

  // ---------- pick up new versions of this page by itself ----------
  function checkVersion(){
    fetch('/local/station.html?t=' + Date.now()).then(function(r){ return r.text(); })
      .then(function(t){ if (t.indexOf("var VERSION = '" + VERSION + "'") < 0 && t.indexOf('var VERSION') >= 0) location.reload(); })
      .catch(function(){});
  }

  function refresh(){
    return loadStates().then(function(){ lastErr = ''; render(); }, function(err){
      if (err.message === 'auth' && token) { token = null; try { localStorage.removeItem('station_token'); } catch(e) {} return setup('That access code didn’t work. Please paste a new one.'); }
      lastErr = 'Home Assistant not reachable'; render(); });
  }

  function start(){
    if (!bearer()) return setup();
    loadStates().then(function(){ return Promise.all([loadRooms(), loadFood(), loadForecast(), loadEvents()]); })
      .then(function(){ render();
        setInterval(refresh, 5000);                 // lights, TV, scenes
        setInterval(function(){ loadFood().then(render); }, 120000);   // meals
        setInterval(render, 20000);                 // clock
        setInterval(loadRooms, 600000);
        setInterval(function(){ loadForecast(); loadEvents().then(render); }, 900000);
        setInterval(checkVersion, 300000); })
      .catch(function(err){ if (err.message === 'auth') { token = null; try { localStorage.removeItem('station_token'); } catch(e) {} setup('That access code didn’t work. Please paste a new one.'); }
                            else setup('Couldn’t reach Home Assistant: ' + err.message); });
  }
  start();
})();
</script>
